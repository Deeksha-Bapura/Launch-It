name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # A throwaway Postgres just for this run
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: launchit
          POSTGRES_PASSWORD: launchit
          POSTGRES_DB: launchit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U launchit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://launchit:launchit@localhost:5432/launchit_test
      SESSION_SECRET: ci-only-secret
      MOCK_AI: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # uses the pnpm version from package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Create tables in the test database
        run: pnpm --filter @workspace/db run push

      - name: Unit and API tests (Jest + Supertest)
        run: pnpm --filter ./artifacts/api-server test

      - name: Install Playwright browser
        run: pnpm --filter ./artifacts/launchit exec playwright install --with-deps chromium

      - name: Browser test (Playwright)
        working-directory: artifacts/launchit
        run: pnpm exec playwright test

      - name: Upload Playwright report if it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            artifacts/launchit/playwright-report
            artifacts/launchit/test-results
          if-no-files-found: ignore

  # Only runs on main, and only if every test above passed
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy backend on Render
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_API }}"
      - name: Deploy frontend on Render
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_WEB }}"